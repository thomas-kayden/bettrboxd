        function pickPoster() {

    <script>
      (function () {
        function enhanceAuth() {
          var gate = document.querySelector(".auth-gate");
          var card = gate && gate.querySelector(".auth-gate-card");
          var mode = card && card.querySelector(".auth-mode");
          var heading = card && card.querySelector(".auth-heading h1");
          var form = card && card.querySelector(".auth-form");
          var wall = gate && gate.querySelector(".auth-poster-wall");
          if (!gate || !card || !mode || !heading || !form || !wall) return false;

          heading.textContent = "Sign in to Bettrboxd";
          card.classList.add("auth-cloudflare-layout");

          var loginButton = Array.from(mode.querySelectorAll("button")).find(function (button) {
            return button.textContent.trim() === "Log in";
          });
          var signupButton = Array.from(mode.querySelectorAll("button")).find(function (button) {
            return button.textContent.trim() === "Sign up";
          });
          if (!card.querySelector(".auth-switch")) {
            var switchCopy = document.createElement("p");
            switchCopy.className = "auth-switch";
             switchCopy.append("Don't have an account? ");
            var switchLink = document.createElement("button");
            switchLink.type = "button";
            switchLink.textContent = "Sign up";
            switchLink.addEventListener("click", function () {
              if (signupButton) signupButton.click();
            });
            switchCopy.append(switchLink);
            form.after(switchCopy);
          }

          var switchCopy = card.querySelector(".auth-switch");
          var switchLink = card.querySelector(".auth-switch button");
           function syncMode() {
             var signup = mode.querySelector('[aria-selected="true"]') === signupButton;
             heading.textContent = signup ? "Create your Bettrboxd account" : "Log in to Bettrboxd";
             if (switchCopy && switchCopy.firstChild) {
               switchCopy.firstChild.textContent = signup ? "Already have an account? " : "Don't have an account? ";
             }
             if (switchLink) {
              switchLink.textContent = signup ? "Log in" : "Sign up";
              switchLink.onclick = function () {
                (signup ? loginButton : signupButton)?.click();
              };
            }
          }
          if (!card.dataset.authHistoryBound) {
            card.dataset.authHistoryBound = "true";
            var restoringHistory = false;
            var buttons = mode.querySelectorAll("button");
            buttons.forEach(function (button) {
              button.addEventListener("click", function () {
                if (!restoringHistory) {
                  history.pushState({}, "", location.pathname + location.search + (button === signupButton ? "#signup" : "#login"));
                }
                setTimeout(syncMode, 0);
              });
            });
            window.addEventListener("popstate", function () {
              restoringHistory = true;
              (location.hash === "#signup" ? signupButton : loginButton)?.click();
              restoringHistory = false;
              syncMode();
            });
            if (location.hash === "#signup") signupButton?.click();
          }
          syncMode();
          return true;
        }

        var observer = new MutationObserver(function () {
          if (enhanceAuth()) observer.disconnect();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        enhanceAuth();
      })();
    </script>
